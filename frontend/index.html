<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PerpPilot AI</title>
  </head>
  <body>
    <div id="root"></div>

    <noscript>PerpPilot AI needs JavaScript enabled.</noscript>

    <!-- Startup safety net: if the app has not drawn anything after 3 seconds,
         show the captured error on the page instead of a blank screen. -->
    <script>
      (function () {
        var errors = [];

        function remember(text) {
          errors.push(text);
        }

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target.tagName === "SCRIPT") {
              remember("A script failed to load: " + target.src);
              return;
            }
            remember(
              (event.message || "Error") +
                "\n  at " + (event.filename || "") + ":" + (event.lineno || "") +
                (event.error && event.error.stack ? "\n" + event.error.stack : "")
            );
          },
          true
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          remember(
            "Unhandled promise rejection: " +
              String((reason && (reason.stack || reason.message)) || reason)
          );
        });

        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) return; // the app started normally

          var box = document.createElement("div");
          box.style.cssText =
            "font:14px/1.5 system-ui,Segoe UI,sans-serif;max-width:880px;margin:40px auto;" +
            "padding:20px;border:1px solid #ef7774;border-radius:12px;background:#1a0f0f;color:#f4f7f5";

          var title = document.createElement("h3");
          title.style.margin = "0 0 8px";
          title.textContent = "PerpPilot could not start";

          var hint = document.createElement("p");
          hint.style.cssText = "margin:0 0 10px;color:#cfd8d3";
          hint.textContent =
            "Copy the text below and send it for a fix. If it says no error was captured, press F12, open the Console tab and copy the first red line.";

          var pre = document.createElement("pre");
          pre.style.cssText =
            "white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#000;padding:12px;border-radius:8px";
          pre.textContent = errors.length ? errors.join("\n\n") : "No error was captured by the page.";

          box.appendChild(title);
          box.appendChild(hint);
          box.appendChild(pre);
          document.body.appendChild(box);
        }, 3000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
